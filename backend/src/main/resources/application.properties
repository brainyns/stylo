spring.application.name=backend

# Base de datos (valores por defecto para desarrollo local con docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stylo}
spring.datasource.username=${DB_USERNAME:stylo}
spring.datasource.password=${DB_PASSWORD:stylo_dev}

# JPA: el esquema lo maneja Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (HS256). El valor por defecto es solo para desarrollo; en producción definir JWT_SECRET
stylo.jwt.secret=${JWT_SECRET:solo-desarrollo-stylo-clave-jwt-no-usar-en-produccion-0123456789}