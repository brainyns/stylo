spring.application.name=backend

# Base de datos (valores por defecto para desarrollo local con docker-compose)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/stylo}
spring.datasource.username=${DB_USERNAME:stylo}
spring.datasource.password=${DB_PASSWORD:stylo_dev}

# JPA: el esquema lo maneja Flyway, Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
